---
- name: Prepare the NFS directory for Spring Boot logs
  hosts: nfs_server
  become: true
  tasks:
    - name: Ensure NFS client mount support is installed on master1
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create shared Spring Boot log directory
      ansible.builtin.file:
        path: /srv/nfs/kubernetes/springboot-logs
        state: directory
        owner: nobody
        group: nogroup
        mode: "0777"
