---
- name: Configure master1 as the NFS server
  hosts: nfs_server
  become: true
  tasks:
    - name: Install NFS server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create NFS export directory
      ansible.builtin.file:
        path: "{{ nfs_export_directory }}"
        state: directory
        owner: nobody
        group: nogroup
        mode: "0777"

    - name: Create exports configuration directory
      ansible.builtin.file:
        path: /etc/exports.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Kubernetes NFS export
      ansible.builtin.copy:
        dest: /etc/exports.d/kubernetes.exports
        owner: root
        group: root
        mode: "0644"
        content: |
          {{ nfs_export_directory }} {{ nfs_allowed_network }}({{ nfs_export_options }})
      notify: Reload NFS exports

    - name: Enable and start NFS server
      ansible.builtin.systemd_service:
        name: nfs-kernel-server
        enabled: true
        state: started

    - name: Apply export changes before configuring clients
      ansible.builtin.meta: flush_handlers

    - name: Verify exported directory
      ansible.builtin.command: exportfs -v
      register: nfs_exports
      changed_when: false
      failed_when: nfs_export_directory not in nfs_exports.stdout

  handlers:
    - name: Reload NFS exports
      ansible.builtin.command: exportfs -rav
      changed_when: true

- name: Configure master2 and workers as NFS clients
  hosts: nfs_clients
  become: true
  tasks:
    - name: Install NFS client
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Wait for NFS server
      ansible.builtin.wait_for:
        host: "{{ nfs_server_address }}"
        port: 2049
        timeout: 30
      become: false

    - name: Create client mount directory
      ansible.builtin.file:
        path: "{{ nfs_client_mount_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add persistent NFS mount to fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^[^#]+[ \\t]+{{ nfs_client_mount_directory | regex_escape }}[ \\t]+"
        line: "{{ nfs_server_address }}:{{ nfs_export_directory }} {{ nfs_client_mount_directory }} nfs4 {{ nfs_mount_options }} 0 0"
        state: present
        backup: true

    - name: Check NFS mount
      ansible.builtin.command:
        argv: [mountpoint, -q, "{{ nfs_client_mount_directory }}"]
      register: nfs_mountpoint
      changed_when: false
      failed_when: false

    - name: Mount NFS directory
      ansible.builtin.command:
        argv: [mount, "{{ nfs_client_mount_directory }}"]
      when: nfs_mountpoint.rc != 0
      changed_when: true

    - name: Write client verification file
      ansible.builtin.copy:
        dest: "{{ nfs_client_mount_directory }}/ansible-test-{{ inventory_hostname }}.txt"
        content: "NFS read/write test from {{ inventory_hostname }}\n"
        mode: "0644"

    - name: Read client verification file
      ansible.builtin.slurp:
        src: "{{ nfs_client_mount_directory }}/ansible-test-{{ inventory_hostname }}.txt"
      register: nfs_test_file

    - name: Confirm NFS read and write access
      ansible.builtin.assert:
        that:
          - "'NFS read/write test from ' + inventory_hostname in (nfs_test_file.content | b64decode)"
        success_msg: "NFS is mounted and writable on {{ inventory_hostname }}"
