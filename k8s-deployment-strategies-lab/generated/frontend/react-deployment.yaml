apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: bank-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react
          image: ratana/reactjs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: RELEASE_VERSION
              value: "base"
