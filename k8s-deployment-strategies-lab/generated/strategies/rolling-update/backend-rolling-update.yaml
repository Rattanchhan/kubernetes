apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-rolling
  namespace: bank-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: springboot-rolling
  template:
    metadata:
      labels:
        app: springboot-rolling
    spec:
      containers:
        - name: springboot
          image: ratana/springboot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9024
          envFrom:
            - configMapRef:
                name: springboot-config
            - secretRef:
                name: springboot-secret
          env:
            - name: RELEASE_VERSION
              value: "v1"
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-rolling-service
  namespace: bank-app
spec:
  selector:
    app: springboot-rolling
  ports:
    - port: 9024
      targetPort: 9024
