apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-rolling
  namespace: bank-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: react-rolling
  template:
    metadata:
      labels:
        app: react-rolling
    spec:
      containers:
        - name: react
          image: ratana/reactjs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: RELEASE_VERSION
              value: "v1"
---
apiVersion: v1
kind: Service
metadata:
  name: react-rolling-service
  namespace: bank-app
spec:
  selector:
    app: react-rolling
  ports:
    - port: 80
      targetPort: 80
