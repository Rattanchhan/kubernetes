apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-recreate
  namespace: bank-app
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: react-recreate
  template:
    metadata:
      labels:
        app: react-recreate
    spec:
      containers:
        - name: react
          image: ratana/reactjs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: RELEASE_VERSION
              value: "v1"
---
apiVersion: v1
kind: Service
metadata:
  name: react-recreate-service
  namespace: bank-app
spec:
  selector:
    app: react-recreate
  ports:
    - port: 80
      targetPort: 80
