apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-stable
  namespace: bank-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: springboot-canary
      track: stable
  template:
    metadata:
      labels:
        app: springboot-canary
        track: stable
    spec:
      containers:
        - name: springboot
          image: ratana/springboot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9024
          envFrom:
            - configMapRef:
                name: springboot-config
            - secretRef:
                name: springboot-secret
          env:
            - name: RELEASE_VERSION
              value: "stable"
