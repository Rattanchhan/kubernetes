apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-green
  namespace: bank-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-bg
      version: green
  template:
    metadata:
      labels:
        app: springboot-bg
        version: green
    spec:
      containers:
        - name: springboot
          image: ratana/springboot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9024
          envFrom:
            - configMapRef:
                name: springboot-config
            - secretRef:
                name: springboot-secret
          env:
            - name: RELEASE_VERSION
              value: "green"
